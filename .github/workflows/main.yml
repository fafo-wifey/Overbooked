name: Build signed Overbooked APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get app files
        uses: actions/checkout@v4
      - name: Extract Android app
        run: |
          unzip -o app.zip -d .
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Restore signing key
        env:          
           KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/overbooked-release.jks"
      - name: Build signed APK
        run: gradle :app:assembleRelease --no-daemon
      - name: Find generated APK
        run: |
          find app/build/outputs/apk -type f -name "*.apk"
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/overbooked-release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      - name: Sign APK
        env:
         SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
         SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
         APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
         test -n "$APKSIGNER"
         "$APKSIGNER" sign \
          --ks "${{ runner.temp }}/overbooked-release.jks" \
          --ks-key-alias overbooked \
          --ks-pass env:SIGNING_STORE_PASSWORD \
          --key-pass env:SIGNING_KEY_PASSWORD \
          --out app/build/outputs/apk/release/Overbooked.apk \
          app/build/outputs/apk/release/app-release-unsigned.apk
         "$APKSIGNER" verify app/build/outputs/apk/release/Overbooked.apk
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Overbooked-Installable-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
